<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> CSS Chalenge </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
  <h2> Real App UI Component </h2>

  <hr>

  <div class="box-1">
    <h3> 🧩 Tugas 1 – Alert Info dengan Tombol X </h3>

    <hr>
    <br>

    <div class="alert">
      <p>ℹ️ Info: Don't Forget To <b>Follow</b> My Instagram Account @fareezyean.</p>
      <button class="close">×</button>
    </div>
  </div>

  <div class="box-1">
    <h3> 🧩 Tugas 2 – Profile Card dengan Foto & Badge </h3>

    <hr>
    <br>

    <div class="profile-card">
      <div class="avatar">
        <img src="assets/gw.jpg" alt="User Photo" />
        <span class="badge">ON</span>
      </div>

      <h3>Ananda Rafif</h3>
      <p>Frontend Developer</p>
    </div>
  </div>

</body>

</html>
