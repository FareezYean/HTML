<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Feedback Form</h1>
  <p class="center">Kritik, Saran dan Masukan</p>

  <hr>

  <div class="navbar">
    <a href="index.html">Beranda</a>
    <a href="biodata.html">Biodata</a>
    <a href="jadwal.html">Jadwal</a>
    <a href="galeri.html">Galeri</a>
    <a href="feedback.html" class="active">Feedback</a>
  </div>

  <hr>

  <div class="feedback-wrapper">
    <h2>Formulir kontak & saran</h2>
    <p>Beri masukkan terbaik anda untuk web ini kedepannya!!!</p>

    <form action="https://httpbin.org/post" method="post">

      <label>Nama Anda (Opsional)</label>
      <input type="text" placeholder="Tulis nama Anda">

      <label>Email Anda*</label>
      <input type="email" placeholder="Tulis email Anda" required>

      <label>Rating Website (1-10)</label>
      <input type="number" min="1" max="10" placeholder="1-10" required>

      <label>Rekomendasi Website Ini</label>
      <div class="radio-group">
        <label><input type="radio" name="rekom" value="ya"> Ya, Sangat</label>
        <label><input type="radio" name="rekom" value="mungkin"> Mungkin Saja</label>
        <label><input type="radio" name="rekom" value="tidak"> Tidak</label>
      </div>

      <label>Topik yang Paling Menarik</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="topik" value="biodata"> Biodata</label>
        <label><input type="checkbox" name="topik" value="jadwal"> Jadwal</label>
        <label><input type="checkbox" name="topik" value="galeri"> Galeri</label>
      </div>

      <label>Bidang Pengembangan</label>
      <select>
        <option>-- Pilih Bidang --</option>
        <option>Desain</option>
        <option>Pemrograman</option>
        <option>Photografi</option>
      </select>

      <label>Pesan/Saran Lengkap</label>
      <textarea rows="5" placeholder="Tulis pesan Anda di sini..."></textarea>

      <div class="button-group">
        <button type="reset" class="reset">Ulang</button>
        <button type="submit" class="submit">Kirim</button>
      </div>

    </form>
  </div>

</body>
</html>
