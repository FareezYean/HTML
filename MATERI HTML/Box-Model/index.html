<!DOCTYPE html>

<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Box model & Position</title>

    <!-- Add pico CSS -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />

    <!-- Add style CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
     <h1>CSS Box Model & Position</h1>
     <hr>
     <h2>Bagian 1 : Box Model</h2>
     <div class="grid">
        <div class "card"> 
            <div id = "box1">
               <p> Box 1 </p>
               <p> Polosan aja </p> 
            </div>
        </div>
        <div class "card"> 
            <div id = "box2">
               <p> Box 2 </p>
               <p> konten + padding </p> 
            </div>
        </div>
        <div class "card"> 
            <div id = "box3">
               <p> Box 3 </p>
               <p> konten + padding + border </p> 
            </div>
        </div>
        <div class "card"> 
            <div id = "box4">
               <p> Box 4 </p>
               <p> konten + padding + border + margin </p> 
            </div>
        </div>
       </div>
    
    <br>
    <hr>
    <br>
    <h2>Bagian 2 : Position</h2>
    <div class="grid">
        <div class="card"> 
            <div id="box5">
                <p> Box 5 </p>
                <p> Static Position </p>
            </div>
        </div>
        <div class="card"> 
            <div id="box6">
                <p> Box 6 </p>
                <p> Relative Position </p>
            </div>
        </div>
        <div class="card">Box7 </div>
        <div class="card">Box8 </div>
    </div>
    </div>
</body>

</html>
